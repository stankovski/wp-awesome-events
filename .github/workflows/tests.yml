name: PHPUnit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2']
        wordpress: ['6.0', '6.4', 'latest']
    
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, zip
          coverage: xdebug
          tools: composer:v2
      
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install MJML
        run: npm install -g mjml
      
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        working-directory: wp-content/plugins/awesome-events
      
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest
        working-directory: wp-content/plugins/awesome-events
      
      - name: Install WordPress test suite
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress }}
        working-directory: wp-content/plugins/awesome-events
        env:
          WP_VERSION: ${{ matrix.wordpress }}
      
      - name: Run unit tests
        run: composer test-unit
        working-directory: wp-content/plugins/awesome-events
        env:
          TEST_SUITE: unit
      
      - name: Run integration tests
        run: composer test-integration
        working-directory: wp-content/plugins/awesome-events
        env:
          TEST_SUITE: integration
      
      - name: Generate code coverage
        if: matrix.php == '8.2' && matrix.wordpress == 'latest'
        run: vendor/bin/phpunit --coverage-clover coverage.xml
        working-directory: wp-content/plugins/awesome-events
      
      - name: Upload coverage to Codecov
        if: matrix.php == '8.2' && matrix.wordpress == 'latest'
        uses: codecov/codecov-action@v3
        with:
          file: ./wp-content/plugins/awesome-events/coverage.xml
          flags: unittests
          name: codecov-awesome-events
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
        working-directory: wp-content/plugins/awesome-events
      
      - name: Run PHPCS
        run: composer phpcs
        working-directory: wp-content/plugins/awesome-events
        continue-on-error: true
